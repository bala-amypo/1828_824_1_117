# Application Configuration
spring.application.name=IT-Policy-Violation-Detection-API
server.port=9001
server.forward-headers-strategy=framework 

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/IT_Policy_Violation_Detection_API?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Amypo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# JWT Configuration (for JwtUtil constructor)
jwt.secret=9a67471b7f12e06c58908f9c09c952b1b5e39626e27302f37c4d5b248a3d5f6e
jwt.validity=3600000
jwt.test-mode=true

# JWT Configuration (alternative - for @Value injection)
app.jwt.secret=9a67471b7f12e06c58908f9c09c952b1b5e39626e27302f37c4d5b248a3d5f6e
app.jwt.expiration=86400000

# Spring Security
spring.security.filter.order=10

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.doc-expansion=none
springdoc.version=1.0.0
springdoc.packages-to-scan=com.example.demo.controller
springdoc.paths-to-match=/api/**,/auth/**

# Logging Configuration
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server Configuration
server.servlet.context-path=/
server.error.include-stacktrace=never
server.error.include-message=always
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# Spring Boot Actuator (Optional)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Hikari Connection Pool (Optimization)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000