# Application Configuration
spring.application.name=IT-Policy-Violation-Detection-API
server.port=9001
server.servlet.context-path=/
server.forward-headers-strategy=framework
server.use-forward-headers=true

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/IT_Policy_Violation_Detection_API?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Amypo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=9a67471b7f12e06c58908f9c09c952b1b5e39626e27302f37c4d5b248a3d5f6e
jwt.validity=3600000
jwt.test-mode=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.syntax-highlight.theme=arta
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# CORS Configuration for production
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.use-relative-redirects=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG